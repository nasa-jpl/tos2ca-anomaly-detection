[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tos2ca"
version = "1.0"
description = "TOS2CA Anomaly Detection Library"
readme = "README.md"
requires-python = "=3.9"
license = { text = "Apache 2.0" }
authors = [
  { name = "Brian Knosp", email = "Brian.Knosp@jpl.nasa.gov" }
]

dependencies = [
  "blosc==1.11.2",
  "boto3==1.24.28",
  "botocore==1.27.59",
  "cartopy==0.22.0",
  "cryptography==39.0.1",
  "dask==2024.8.0",
  "fastparquet==2024.11.0",
  "geojson==3.0.1",
  "geos==0.2.3",
  "h5netcdf==1.2.0",
  "h5py==3.7.0",
  "herbie-data==2024.8.0",
  "matplotlib==3.6.2",
  "netCDF4==1.6.2",
  "numba==0.60.0",
  "numpy==1.24.3",
  "pandas==1.5.3",
  "psutil==7.1.0",
  "pyarrow==21.0.0",
  "Pillow==9.4.0",
  "PyMySQL==1.0.2",
  "redis==5.0.1",
  "requests==2.29.0",
  "s3fs==2023.3.0",
  "s3transfer==0.6.0",
  "scikit-image==0.19.3",
  "scipy==1.10.1",
  "Shapely==1.8.1",
  "sip==6.6.2",
  "six==1.16.0",
  "tqdm==4.67.1",
  "urllib3==1.26.16",
  "valkey==6.1.0",
  "xarray==2022.11.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]